<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d"><title>黄金指挥中心 · GOLD COMMAND</title><style>
:root{--bg:#07090d;--pn:#0e1218;--ln:#1e2530;--gd:#d4af37;--gd2:#f5d77a;--tx:#d8dde5;--mu:#6b7684;--up:#22c55e;--dn:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
body{padding-bottom:44px;background:radial-gradient(1200px 500px at 50% -200px,#1a1608 0,transparent 70%),var(--bg)}
.mono{font-family:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ln);font-size:12px;letter-spacing:.08em;color:var(--mu)}
.brand{color:var(--gd);font-weight:700;letter-spacing:.2em}.live{color:var(--up)}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.2}}
.wrap{max-width:1400px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.pn{background:linear-gradient(180deg,#10151c,#0b0f14);border:1px solid var(--ln);border-radius:6px;padding:14px;position:relative;overflow:hidden}
.pn:before{content:"";position:absolute;left:0;top:0;width:40px;height:2px;background:var(--gd)}
.h{font-size:11px;letter-spacing:.18em;color:var(--gd);margin:0 0 10px;text-transform:uppercase;display:flex;justify-content:space-between}.h small{color:var(--mu);letter-spacing:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}
.hero{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.px{font-size:64px;font-weight:700;line-height:1;color:#fff;transition:color .3s;padding:2px 8px;border-radius:4px;margin-left:-8px}
.px.fu{animation:fu 1.6s}.px.fd{animation:fd 1.6s}@keyframes fu{0%{background:rgba(34,197,94,.45);color:#bbf7d0}100%{background:transparent}}@keyframes fd{0%{background:rgba(239,68,68,.45);color:#fecaca}100%{background:transparent}}
.chg{font-size:20px;font-weight:600;margin-top:6px}.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.clk{display:grid;grid-template-columns:repeat(4,minmax(80px,1fr));gap:8px}.clk div{border:1px solid var(--ln);border-radius:4px;padding:8px 10px;background:#0a0d12}
.clk b{display:block;font-size:22px;color:var(--gd2)}.clk span{font-size:11px;color:var(--mu);letter-spacing:.1em}
svg.map{width:100%;height:auto;display:block}svg.map .land circle{fill:#2a3240}
.pin .core{fill:var(--gd)}.pin .pulse{fill:none;stroke:var(--gd);stroke-width:1.5;animation:pu 2.4s infinite ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%{transform:scale(1);opacity:1}100%{transform:scale(5);opacity:0}}
.pin text{fill:#f3e2a6;font-size:13px;font-weight:600;paint-order:stroke;stroke:#07090d;stroke-width:3px}.pin .ts{fill:#8b95a3;font-weight:400;font-size:11px}
.gauge{display:flex;flex-direction:column;align-items:center}.gauge svg{width:100%;max-width:300px}
.gl{display:flex;justify-content:space-between;width:100%;font-size:12px;margin-top:6px}.gl b{font-size:18px;display:block}
#needle{transition:transform 1.2s cubic-bezier(.2,.8,.2,1);transform-origin:150px 150px}
.tl{list-style:none;margin:0;padding:0;max-height:360px;overflow-y:auto}.tl li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--ln);font-size:13px;animation:fi .6s both}
.tl .t{color:var(--gd2)}.tg{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;margin-right:4px;border:1px solid}
.k{color:var(--gd);border-color:#5a4a16}.s-完成{color:var(--up);border-color:#1f5134}.s-进行中{color:#60a5fa;border-color:#1e3a5f}.s-无新内容{color:var(--mu);border-color:var(--ln)}.s-出错{color:var(--dn);border-color:#5b1f1f}.nt{color:#c4b5fd;border-color:#3b2f63}
.ags{display:grid;
